 render('static-image',{ kind:'plot',displayId:'static-image',mime:'image/svg+xml',imageData:plotData.svgData,resizable:false },gallery);
 await loaded(gallery.querySelector('img'));
 check(getComputedStyle(control(gallery,'Fit R device to cell width')).display==='none' && !control(gallery,'Save plot as').disabled,'Standard graphics images must be viewable and exportable without offering resize');
 renderer.disposeOutputItem('static-image'); gallery.remove();
 const temporary=document.createElement('div'); document.body.append(temporary);
 render('temporary',plotData,temporary);
 const oldTrigger=control(temporary,'Save plot as'); oldTrigger.click(); const oldRequest=messages.at(-1);
 render('temporary',plotData,temporary);
 const beforeStale=messages.length; reply(oldRequest,{ result:'svg' }); oldTrigger.click();
 check(messages.length===beforeStale,'Output replacement must discard pending format replies and old button handlers');
 control(temporary,'Save plot as').click(); const disposedRequest=messages.at(-1);
 renderer.disposeOutputItem('temporary'); reply(disposedRequest,{ result:'svg' });
 check(messages.at(-1)===disposedRequest,'Disposing output must discard pending format replies');
 temporary.remove();
 const broken=document.createElement('div'); document.body.append(broken);
 render('broken',{ kind:'plot',svgData:'invalid' },broken);
 await new Promise(resolve=>broken.querySelector('img').addEventListener('error',resolve,{ once:true }));
 control(broken,'Save plot as').click();
 check(!messages.at(-1).pngReady && broken.querySelector('[data-status]').textContent.includes('Could not load'),'Failed images must keep PNG unavailable and explain the problem');
 renderer.disposeOutputItem('broken'); broken.remove();
 render('html',{ kind:'htmlText',text:'<button onclick="this.textContent=\'Widget works\'">Try widget</button>' },document.querySelector('#html'));
 check(document.querySelector('#html iframe').getAttribute('sandbox')==='allow-scripts allow-forms allow-downloads','HTML must retain sandboxing');
 renderer.disposeOutputItem();
 // Restore usable examples for manual pointer, Tab/Shift+Tab, and visual checks.
 render('plot',galleryData,plot);
 render('table',printedData,table);
 render('large-demo',{ ...largeData,displayId:'large-demo',totalRows:1000 },document.querySelector('#large'));
 document.querySelector('#result').scrollIntoView();
 document.querySelector('#result').textContent=`${assertions} renderer assertions passed`;
 document.body.dataset.result='passed';
} catch(error) {
 document.querySelector('#result').textContent=String(error);
 document.querySelector('#result').style.background='#641e1e';
 document.body.dataset.result='failed';
 throw error;
}
