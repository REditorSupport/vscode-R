name: marketplace-pre-release

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: marketplace-pre-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    if: github.repository == 'REditorSupport/vscode-R' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.previous.outputs.publish }}
      date: ${{ steps.previous.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check publication history
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/marketplace-pre-release-history.js

  verify:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/main.yml
    with:
      prerelease-date: ${{ needs.prepare.outputs.date }}

  publish:
    needs: [prepare, verify]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Download verified pre-release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-R.vsix
          path: artifacts/
      - name: Recheck publication eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/marketplace-pre-release-history.js
      - name: Publish to Visual Studio Marketplace
        if: steps.eligibility.outputs.publish == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
        run: pnpm exec vsce publish --pre-release --skip-duplicate --packagePath artifacts/vscode-R.vsix
      - name: Publish to Open VSX Registry
        if: steps.eligibility.outputs.publish == 'true'
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: pnpm exec ovsx publish --skip-duplicate artifacts/vscode-R.vsix
