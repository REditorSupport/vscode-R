name: workflow-helpers

on:
  push:
    paths:
      - '.github/scripts/marketplace-pre-release-history.js'
      - '.github/scripts/marketplace-pre-release-history.test.js'
      - '.github/workflows/marketplace-pre-release.yml'
      - '.github/workflows/workflow-helpers.yml'
  pull_request:
    paths:
      - '.github/scripts/marketplace-pre-release-history.js'
      - '.github/scripts/marketplace-pre-release-history.test.js'
      - '.github/workflows/marketplace-pre-release.yml'
      - '.github/workflows/workflow-helpers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test Marketplace pre-release history helper
        run: node --test .github/scripts/marketplace-pre-release-history.test.js
