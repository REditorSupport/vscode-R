name: release

# runs when a tag v* is pushed
# releases the extension to GitHub and the vscode marketplace

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check stable version and release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/scripts/extension-version.js check-stable "$RELEASE_TAG"

  verify:
    needs: check-version
    uses: ./.github/workflows/main.yml

  release:
    name: Release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # Create the GitHub Release only after both registries have the version.
    needs:
      - publish-vs-marketplace
      - publish-open-vsx
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vscode-R.vsix
          path: artifacts/
      - name: Create release
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mv artifacts/vscode-R.vsix "artifacts/r-$VERSION.vsix"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            # A previous attempt may have created the release without the asset.
            echo "Release v$VERSION already exists; uploading the VSIX."
            gh release upload "v$VERSION" "artifacts/r-$VERSION.vsix" --clobber
          else
            gh release create "v$VERSION" "artifacts/r-$VERSION.vsix" \
              --title "v$VERSION" \
              --notes "Release v$VERSION" \
              --generate-notes
          fi

  publish-vs-marketplace:
    name: Publish to Visual Studio Marketplace
    # TODO: Uncomment when switching to trusted publishing (OIDC, no token); a repository admin must create the vs-marketplace environment first.
    # environment: vs-marketplace
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vscode-R.vsix
          path: artifacts/
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
        run: pnpm exec vsce publish --skip-duplicate --packagePath artifacts/*.vsix

  publish-open-vsx:
    name: Publish to Open VSX Registry
    # TODO: Uncomment when switching to trusted publishing (OIDC, no token); a repository admin must create the open-vsx environment first.
    # environment: open-vsx
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vscode-R.vsix
          path: artifacts/
      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: pnpm exec ovsx publish --skip-duplicate --packagePath artifacts/*.vsix
