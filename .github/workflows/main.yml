name: main
on:
  push:
    branches:
      - main
    paths: &extension-paths
      # Deny-list: new files trigger the extension tests unless excluded here.
      # Later patterns override earlier ones, so re-included files follow the
      # exclusions that would otherwise drop them.
      - '**'
      - '!README.md'
      - '!CHANGELOG.md'
      - '!CHANGELOG.old.md'
      - '!CONTRIBUTING.md'
      - '!AGENTS.md'
      - '!cliff.toml'
      - '!.gitignore'
      - '!.markdownlint.json'
      - '!.oxfmtrc.jsonc'
      - '!.oxlintrc.jsonc'
      - '!**/.lintr'
      - '!.vscode/**'
      - '!.agents/**'
      - '!.claude/**'
      - '!.codex/**'
      - '!.roborev/**'
      - '!scripts/benchmark-*'
      - '!.github/**'
      - '.github/actions/**'
      - '.github/workflows/main.yml'
      - '.github/scripts/extension-version.js'
      - '.github/scripts/extension-version.test.js'
      - '.github/scripts/verify-sess-vsix.js'
  pull_request:
    branches:
      - main
    paths: *extension-paths
  workflow_call:
    inputs:
      prerelease-date:
        description: UTC date for the Marketplace pre-release (YYYY-MM-DD)
        type: string
        default: ''
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Node and extension-host tests run as parallel jobs per OS. Both need the
  # same R, sess and arf runtime, which the local composite actions set up.
  test-node:
    name: Node (${{ matrix.os }})
    env:
      VSCR_REQUIRE_PLOT_TESTS: '1'
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-test-tools
      # Bootstrap checks run before R test dependencies are installed.
      - name: Verify sess source identity and bootstrap
        run: pnpm run test:sess-source
      - name: Verify managed tool library
        run: pnpm run test:tool-library
      - name: Verify managed tool consent
        run: pnpm run test:tool-consent
      - uses: ./.github/actions/prepare-test-runtime
      - name: Verify managed jgd preparation
        run: pnpm run test:prepare-jgd
      - name: Verify managed rstudioapi preparation
        run: pnpm run test:prepare-rstudioapi
      - name: Verify installed sess identity
        run: |
          source("R/sess_source.R")
          stopifnot(!sess_install_required("dist/resources/sess"))
        shell: Rscript {0}
      - name: Run sess tests
        run: tinytest::test_package("sess")
        shell: Rscript {0}
      - name: Test persistent tmux sessions (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          VSCR_TEST_TMUX=1 pnpm exec mocha out/test/node/interactiveRuntime.test.js --ui tdd --timeout 60000 --grep "^Interactive real R runtime standalone agent survives its launcher process exiting$"
      - name: Run Node tests including live plot lifecycle tests
        run: pnpm run test:node
  test-extension:
    name: Extension (${{ matrix.os }})
    env:
      VSCR_REQUIRE_PLOT_TESTS: '1'
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-test-tools
      - uses: ./.github/actions/prepare-test-runtime
      - name: Run plot lifecycle extension tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:extension --label plot-lifecycle
      - name: Run plot lifecycle extension tests
        if: runner.os != 'Linux'
        run: pnpm run test:extension --label plot-lifecycle
      - name: Run extension tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:extension --label provider-tests --label editor-command-tests --label interactive-integration
      - name: Run extension tests
        if: runner.os != 'Linux'
        run: pnpm run test:extension --label provider-tests --label editor-command-tests --label interactive-integration
      - name: Preserve extension test failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-test-logs-${{ runner.os }}
          path: |
            .vscode-test/user-data/**/logs/**/exthost/exthost.log
            .vscode-test/user-data/**/logs/**/exthost/output_logging_*/*.log
          retention-days: 7
  build:
    runs-on: ubuntu-latest
    env:
      VSIX_FILE: vscode-R.vsix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Test extension versioning
        run: node --test .github/scripts/extension-version.test.js
      - name: Set Marketplace pre-release version
        if: inputs.prerelease-date
        env:
          PRERELEASE_DATE: ${{ inputs.prerelease-date }}
        run: node .github/scripts/extension-version.js prerelease "$PRERELEASE_DATE"
      - name: Package Marketplace pre-release
        if: inputs.prerelease-date
        run: pnpm exec vsce package --pre-release --no-dependencies -o $VSIX_FILE
      - name: Package extension
        if: ${{ !inputs.prerelease-date }}
        run: pnpm exec vsce package --no-dependencies -o $VSIX_FILE
      - name: Verify packaged sess identity
        run: node .github/scripts/verify-sess-vsix.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.VSIX_FILE }}
          path: ${{ env.VSIX_FILE }}
