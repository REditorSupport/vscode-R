name: main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Verify sess source identity and bootstrap
        run: pnpm run test:sess-source
      - name: Install R test dependencies
        run: install.packages(c("remotes", "pkgbuild", "languageserver", "lintr", "renv"))
        shell: Rscript {0}
      - run: pnpm run build
      - name: Verify installed sess identity
        run: |
          source("R/sess_source.R")
          stopifnot(!sess_install_required("dist/resources/sess"))
        shell: Rscript {0}
      - name: Run sess tests
        run: tinytest::test_package("sess")
        shell: Rscript {0}
      - name: Test persistent tmux sessions (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          pnpm run compile
          pnpm exec tsc
          VSCR_TEST_TMUX=1 pnpm exec mocha out/test/suite/interactiveRuntime.test.js --ui tdd --timeout 60000
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test
      - name: Run tests
        if: runner.os != 'Linux'
        run: pnpm run test
      - name: Preserve extension test failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-test-logs-${{ runner.os }}
          path: |
            .vscode-test/user-data/logs/**/exthost/exthost.log
            .vscode-test/user-data/logs/**/exthost/output_logging_*/*.log
          retention-days: 7
  build:
    runs-on: ubuntu-latest
    env:
      VSIX_FILE: vscode-R.vsix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Package extension
        run: pnpm exec vsce package --no-dependencies -o $VSIX_FILE
      - name: Verify packaged sess identity
        run: node .github/scripts/verify-sess-vsix.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.VSIX_FILE }}
          path: ${{ env.VSIX_FILE }}
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
      - name: Install lintr
        run: install.packages("lintr")
        shell: Rscript {0}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm exec eslint src --ext ts

      - name: Lint R directory
        run: lintr::lint_dir("./R")
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

      - name: Lint root directory
        run: lintr::lint_package("sess")
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
