name: pre-release

# creates/updates a pre-release with the .vsix 

on:
  push:
    branches: ["main"]

env:
  FILE_OUT: r-latest.vsix
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VSIX_FILE: vscode-R.vsix    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'
      - run: npm install
      - name: Package extension
        run: npx @vscode/vsce package -o $VSIX_FILE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.VSIX_FILE }}"
          path: "${{ env.VSIX_FILE }}"

  pre-release:
    name: Pre-Release
    needs: build
    runs-on: ubuntu-latest
    env:
      VSIX_FILE: vscode-R.vsix    
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "${{ env.VSIX_FILE }}"
          path: "artifacts/"
      - name: Create or update pre-release
        run: |
          gh release delete latest --yes || true
          git tag -d latest || true
          git tag latest
          git push origin latest --force
          gh release create latest artifacts/${{ env.VSIX_FILE }} \
            --title "Development Build" \
            --notes "Contains the vsix-file from the latest push to main." \
            --prerelease
