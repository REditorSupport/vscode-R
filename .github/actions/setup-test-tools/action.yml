name: Set up test tools
description: >-
  Install R, pnpm, Node.js and the locked npm dependencies. R packages are not
  installed yet, so sess bootstrap checks can run in this base environment.
runs:
  using: composite
  steps:
    - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      with:
        use-public-rspm: true
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile
      shell: bash
